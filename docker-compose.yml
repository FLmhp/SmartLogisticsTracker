services:
  api:
    build:
      context: .
      dockerfile: src/SmartLogisticsTracker.Api/Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
    image: smartlogistics-api:${VERSION:-latest}
    container_name: smartlogistics-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # 如需改用 PostgreSQL，取消下面两行注释并启用 postgres 服务
      # Database__Provider: PostgreSql
      # ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=smart_logistics_tracker;Username=postgres;Password=postgres
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-ChangeMe_InProduction_PleaseUseLongRandomSecret}
      Mqtt__Enabled: "${MQTT_ENABLED:-false}"
      Mqtt__Host: ${MQTT_HOST:-127.0.0.1}
      Mqtt__Port: ${MQTT_PORT:-1883}
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # postgres:
